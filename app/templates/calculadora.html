<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Interactiva</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #45a049;
            --secondary: #2196F3;
            --danger: #f44336;
            --light: #f5f5f5;
            --dark: #333;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--dark);
            font-weight: 600;
            position: relative;
            padding-bottom: 10px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: var(--transition);
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        .operations {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .operation-btn {
            background: white;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .operation-btn:hover {
            background: #f9f9f9;
            border-color: var(--primary);
        }

        .operation-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 25px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.5s ease;
        }

        .result-container.show {
            max-height: 200px;
        }

        .result {
            padding: 15px;
            background: #e3ffe3;
            border-left: 5px solid var(--primary);
            border-radius: 8px;
            animation: fadeIn 0.5s ease;
        }

        .error {
            padding: 15px;
            background: #ffe3e3;
            border-left: 5px solid var(--danger);
            border-radius: 8px;
            animation: fadeIn 0.5s ease;
        }

        .history {
            margin-top: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .history h3 {
            margin-bottom: 10px;
            color: var(--dark);
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #777;
            font-size: 14px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 0.5s ease;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
            
            .operations {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Calculadora</h1>

        <form id="calculator-form">
            <div class="input-group">
                <label for="a">Número 1:</label>
                <input type="number" id="a" name="a" required placeholder="Ingresa el primer número">
            </div>

            <div class="input-group">
                <label for="b">Número 2:</label>
                <input type="number" id="b" name="b" required placeholder="Ingresa el segundo número">
            </div>

            <div class="input-group">
                <label>Operación:</label>
                <div class="operations">
                    <div class="operation-btn" data-op="suma">+</div>
                    <div class="operation-btn" data-op="resta">-</div>
                    <div class="operation-btn" data-op="mul">×</div>
                    <div class="operation-btn" data-op="div">÷</div>
                </div>
                <select name="op" id="op" style="display: none;">
                    <option value="suma">Suma</option>
                    <option value="resta">Resta</option>
                    <option value="mul">Multiplicación</option>
                    <option value="div">División</option>
                </select>
            </div>

            <button type="submit">
                <span>Calcular</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M6 12.796V3.204L11.481 8 6 12.796zm.659.753 5.48-4.796a1 1 0 0 0 0-1.506L6.66 2.451C6.011 1.885 5 2.345 5 3.204v9.592a1 1 0 0 0 1.659.753z"/>
                </svg>
            </button>
        </form>

        <div class="result-container" id="result-container">
            <!-- Aquí se mostrarán los resultados dinámicamente -->
        </div>

        <div class="history">
            <h3>Historial</h3>
            <div class="history-list" id="history-list">
                <!-- Aquí se mostrará el historial -->
            </div>
        </div>

        <div class="footer">
            Realizado por Elvis Alberto Montoya Rondon.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('calculator-form');
            const operationBtns = document.querySelectorAll('.operation-btn');
            const opSelect = document.getElementById('op');
            const resultContainer = document.getElementById('result-container');
            const historyList = document.getElementById('history-list');
            
            // Historial de cálculos
            let calculationHistory = [];
            
            // Seleccionar operación con botones
            operationBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Remover clase activa de todos los botones
                    operationBtns.forEach(b => b.classList.remove('active'));
                    
                    // Agregar clase activa al botón clickeado
                    this.classList.add('active');
                    
                    // Actualizar el valor del select oculto
                    opSelect.value = this.getAttribute('data-op');
                });
            });
            
            // Manejar envío del formulario
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Obtener valores del formulario
                const a = parseFloat(document.getElementById('a').value);
                const b = parseFloat(document.getElementById('b').value);
                const op = opSelect.value;
                
                // Validar que se haya seleccionado una operación
                if (!op) {
                    showError('Por favor selecciona una operación');
                    return;
                }
                
                // Realizar cálculo
                let result;
                let operationSymbol;
                
                try {
                    switch(op) {
                        case 'suma':
                            result = a + b;
                            operationSymbol = '+';
                            break;
                        case 'resta':
                            result = a - b;
                            operationSymbol = '-';
                            break;
                        case 'mul':
                            result = a * b;
                            operationSymbol = '×';
                            break;
                        case 'div':
                            if (b === 0) {
                                throw new Error('No se puede dividir por cero');
                            }
                            result = a / b;
                            operationSymbol = '÷';
                            break;
                        default:
                            throw new Error('Operación no válida');
                    }
                    
                    // Mostrar resultado
                    showResult(`${a} ${operationSymbol} ${b} = ${result}`);
                    
                    // Agregar al historial
                    addToHistory(`${a} ${operationSymbol} ${b} = ${result}`);
                    
                } catch (error) {
                    showError(error.message);
                }
            });
            
            // Función para mostrar resultado
            function showResult(message) {
                resultContainer.innerHTML = `<div class="result"><strong>Resultado:</strong> ${message}</div>`;
                resultContainer.classList.add('show');
                
                // Añadir animación de pulso
                const resultDiv = resultContainer.querySelector('.result');
                resultDiv.classList.add('pulse');
                setTimeout(() => {
                    resultDiv.classList.remove('pulse');
                }, 500);
            }
            
            // Función para mostrar error
            function showError(message) {
                resultContainer.innerHTML = `<div class="error"><strong>Error:</strong> ${message}</div>`;
                resultContainer.classList.add('show');
            }
            
            // Función para agregar al historial
            function addToHistory(calculation) {
                calculationHistory.unshift(calculation);
                
                // Limitar el historial a 5 elementos
                if (calculationHistory.length > 5) {
                    calculationHistory.pop();
                }
                
                // Actualizar la vista del historial
                updateHistoryView();
            }
            
            // Función para actualizar la vista del historial
            function updateHistoryView() {
                historyList.innerHTML = '';
                
                calculationHistory.forEach(calc => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'history-item';
                    historyItem.textContent = calc;
                    historyList.appendChild(historyItem);
                });
            }
            
            // Inicializar con la primera operación seleccionada
            operationBtns[0].click();
        });
    </script>

</body>
</html>
